# ---------------------------------------------------------------- superficies
Panel.background=#E4EBEA
SplitPane.background=#E4EBEA
OptionPane.background=#E4EBEA
Viewport.background=#E4EBEA
Dialog.background=#E4EBEA

# ---------------------------------------------------------------- texto
Label.foreground=#0B181C
Label.font=Segoe UI, Plain, 15
Label.disabledForeground=#8A9BA1

# ---------------------------------------------------------------- tipografia
TextField.font=Segoe UI, Plain, 16
PasswordField.font=Segoe UI, Plain, 16
TextArea.font=Segoe UI, Plain, 15
Button.font=Segoe UI, Plain, 15
CheckBox.font=Segoe UI, Plain, 15
RadioButton.font=Segoe UI, Plain, 15
ComboBox.font=Segoe UI, Plain, 15
Table.font=Segoe UI, Plain, 15
TableHeader.font=Segoe UI, Semibold, 13

# ---------------------------------------------------------------- campos
TextField.background=#FFFFFF
TextField.foreground=#0B181C
TextField.caretColor=#0F6C5D
TextField.placeholderText=#6B858E
TextField.inactiveForeground=#6B858E
TextField.borderColor=#CBD9D6
TextField.disabledBackground=#F0F4F3
TextField.disabledForeground=#8A9BA1

Component.arc=8
Component.focusWidth=2
Component.focusColor=#0F6C5D
Component.hoverColor=#DCE7E5
Component.borderColor=#CBD9D6

# ---------------------------------------------------------------- botones
Button.background=#FFFFFF
Button.foreground=#0B181C
Button.borderColor=#CBD9D6
Button.focusColor=#0F6C5D
Button.arc=8
Button.disabledBackground=#F0F4F3
Button.disabledForeground=#8A9BA1

# ---------------------------------------------------------------- tabla
Table.background=#FFFFFF
Table.foreground=#0B181C
Table.gridColor=#DCE7E5
Table.showHorizontalLines=true
Table.showVerticalLines=false
Table.rowHeight=64
Table.cellPaddingX=16
Table.cellPaddingY=12
Table.selectionBackground=#DCE7E5
Table.selectionForeground=#0B181C
Table.alternateRowColor=#F4F8F7

TableHeader.background=#DCE7E5
TableHeader.foreground=#48606A
TableHeader.borderColor=#CBD9D6

# ---------------------------------------------------------------- scroll
ScrollPane.background=#FFFFFF
ScrollBar.background=#FFFFFF
ScrollBar.thumbColor=#AFC6C1
ScrollBar.thumbHoverColor=#8FADA6
ScrollBar.trackColor=#FFFFFF
ScrollBar.width=12

# ---------------------------------------------------------------- separadores
Separator.foreground=#CBD9D6
Separator.thickness=1

# ---------------------------------------------------------------- barra de titulo
TitlePane.background=#F4F8F7
TitlePane.foreground=#48606A
TitlePane.height=44

