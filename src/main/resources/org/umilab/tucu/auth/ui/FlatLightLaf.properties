TabbedPane.background=#E4EBEA
TabbedPane.foreground=#0B181C
TabbedPane.selectedBackground=#FFFFFF
TabbedPane.focusColor=#0F6C5D

# ---------------------------------------------------------------- listas
List.background=#FFFFFF
List.foreground=#0B181C
