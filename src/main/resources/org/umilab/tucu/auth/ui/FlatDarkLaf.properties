# ============================================================================
#  TUCU AUTHENTICATOR - tema oscuro  (por defecto)
#  FormDev FlatLaf custom properties
#
#  Cargar con:
#     FlatLaf.registerCustomDefaultsSource("org.umilab.tucu.auth.ui.TucuTheme");
#     FlatLaf.setLaf(FlatDarkLaf());   // o FlatLightLaf() para el tema claro
#     FlatLaf.updateUI();
#
#  Ver TUCU_GUIA_DISENO.md seccion 4 para el modo de conmutacion.
#  Todos los valores de color pasan WCAG AA o superior; ver seccion 3.
# ============================================================================

# ---------------------------------------------------------------- superficies
Panel.background=#0B181C
SplitPane.background=#0B181C
OptionPane.background=#0B181C
Viewport.background=#0B181C
Dialog.background=#0B181C

# ---------------------------------------------------------------- texto
Label.foreground=#E8F1F3
Label.font=Segoe UI, Plain, 15
Label.disabledForeground=#6F868D

# ---------------------------------------------------------------- tipografia
TextField.font=Segoe UI, Plain, 16
PasswordField.font=Segoe UI, Plain, 16
TextArea.font=Segoe UI, Plain, 15
Button.font=Segoe UI, Plain, 15
CheckBox.font=Segoe UI, Plain, 15
RadioButton.font=Segoe UI, Plain, 15
ComboBox.font=Segoe UI, Plain, 15
Table.font=Segoe UI, Plain, 15
TableHeader.font=Segoe UI, Semibold, 13

# ---------------------------------------------------------------- campos
TextField.background=#1A2C36
TextField.foreground=#E8F1F3
TextField.caretColor=#7FDCC6
TextField.placeholderText=#7A949C
TextField.inactiveForeground=#7A949C
TextField.borderColor=#2A4A54
TextField.disabledBackground=#14232A
TextField.disabledForeground=#5A727A

Component.arc=8
Component.focusWidth=2
Component.focusColor=#7FDCC6
Component.hoverColor=#22404A
Component.borderColor=#2A4A54

# ---------------------------------------------------------------- botones
Button.background=#1A2C36
Button.foreground=#E8F1F3
Button.borderColor=#2A4A54
Button.focusColor=#7FDCC6
Button.arc=8
Button.disabledBackground=#14232A
Button.disabledForeground=#5A727A

# ---------------------------------------------------------------- tabla
Table.background=#0F1E23
Table.foreground=#E8F1F3
Table.gridColor=#22404A
Table.showHorizontalLines=true
Table.showVerticalLines=false
Table.rowHeight=64
Table.cellPaddingX=16
Table.cellPaddingY=12
Table.selectionBackground=#22404A
Table.selectionForeground=#E8F1F3
Table.alternateRowColor=#122229

TableHeader.background=#1A2C36
TableHeader.foreground=#A6BCC3
TableHeader.borderColor=#2A4A54

# ---------------------------------------------------------------- scroll
ScrollPane.background=#0F1E23
ScrollBar.background=#0F1E23
ScrollBar.thumbColor=#3A5F6A
ScrollBar.thumbHoverColor=#4A7A87
ScrollBar.trackColor=#0F1E23
ScrollBar.width=12

# ---------------------------------------------------------------- separadores
Separator.foreground=#2A4A54
Separator.thickness=1

# ---------------------------------------------------------------- barra de titulo
TitlePane.background=#0F1E23
TitlePane.foreground=#A6BCC3
TitlePane.height=44

# ---------------------------------------------------------------- pestanas
TabbedPane.background=#0B181C
TabbedPane.foreground=#E8F1F3
TabbedPane.selectedBackground=#1A2C36
TabbedPane.focusColor=#7FDCC6

# ---------------------------------------------------------------- listas
List.background=#0F1E23
List.foreground=#E8F1F3
List.selectionBackground=#22404A

# ---------------------------------------------------------------- progreso
ProgressBar.background=#14232A
ProgressBar.foreground=#5FC4AB

# ---------------------------------------------------------------- tokens propios
# No los resuelve Swing; los lee TucuTheme.token() desde los componentes
# dibujados a mano (linea de marea, celda de codigo, chip de issuer).
Tide.fresh=#5FC4AB
Tide.warm=#DCA748
Tide.urgent=#E2795F
Code.background=#0B181C
Code.foreground=#E8F1F3
Code.expiring=#DCA748
Brand=#5FC4AB
Surface.raised=#1A2C36
Surface.hover=#22404A
Line.subtle=#2A4A54